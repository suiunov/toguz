name: Web app as Android app (Capacitor)

on:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json', '*.png', 'capacitor/**', '.github/workflows/web-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capacitor-app
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci
      - name: Copy web game into the app
        run: npm run build && npx cap sync android

      - name: Build APK
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../toguz-web-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: toguz-web-app-apk
          path: capacitor/toguz-web-app.apk

      - name: Publish APK on the Releases page
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-app-latest
          name: Тогуз коргоол — web version as app (Android test build)
          prerelease: true
          body: "The web game wrapped with Capacitor, built automatically from main. Download toguz-web-app.apk on your phone and open it to install."
          files: capacitor/toguz-web-app.apk

  ios:
    runs-on: macos-latest
    needs: android
    defaults:
      run:
        working-directory: capacitor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Build for iPhone simulator (no signing, just checks it compiles)
        working-directory: capacitor/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}
