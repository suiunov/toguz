name: Flutter app

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-app
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android and iOS project folders (first run only)
        id: create
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios --org kg.toguz --project-name toguz_korgool .
            rm -f test/widget_test.dart
            echo "created=1" >> "$GITHUB_OUTPUT"
          fi

      - name: App name, portrait only
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Тогуз коргоол"/' android/app/src/main/AndroidManifest.xml
          grep -q 'screenOrientation' android/app/src/main/AndroidManifest.xml || \
            sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          /usr/bin/python3 - <<'PY'
          import re
          p='ios/Runner/Info.plist'; s=open(p,encoding='utf-8').read()
          s=re.sub(r'(<key>CFBundleDisplayName</key>\s*<string>)[^<]*(</string>)', r'\1Тогуз коргоол\2', s)
          if 'CFBundleDisplayName' not in s:
              s=s.replace('<dict>','<dict>\n\t<key>CFBundleDisplayName</key>\n\t<string>Тогуз коргоол</string>',1)
          s=re.sub(r'(<key>UISupportedInterfaceOrientations</key>\s*<array>).*?(</array>)', r'\1\n\t\t<string>UIInterfaceOrientationPortrait</string>\n\t\2', s, count=1, flags=re.S)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Check code
        id: analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat analyze.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -E ' - ' analyze.txt | head -n 60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter analyze::${msg}"
          fi

      - name: Tests
        id: test
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat test.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -vE '^\s*$' test.txt | tail -n 80 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter test::${msg}"
          fi

      - name: Build APK
        id: apk
        run: |
          set +e
          flutter build apk --release > build.txt 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 60 build.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -vE '^\s*$' build.txt | tail -n 60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter build apk::${msg}"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.apk.outputs.code == '0'
        with:
          name: toguz-korgool-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK on the Releases page
        if: steps.apk.outputs.code == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Тогуз коргоол (Android test build)
          prerelease: true
          body: "Latest Android build of the Flutter app, made automatically from the main branch. Download app-release.apk on your phone and open it to install."
          files: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Save generated project folders to the repository
        if: steps.create.outputs.created == '1'
        continue-on-error: true
        working-directory: .
        run: |
          set +e
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A app/android app/ios
            git commit -m "Add Android and iOS project folders (generated by flutter create)"
            git push origin HEAD:main
          } > save.txt 2>&1
          code=$?
          cat save.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -n 30 save.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=save folders::${msg}"
          fi
          exit $code

      - name: Fail if any step failed
        run: |
          [ "${{ steps.analyze.outputs.code }}" = "0" ] && [ "${{ steps.test.outputs.code }}" = "0" ] && [ "${{ steps.apk.outputs.code }}" = "0" ]

  ios:
    runs-on: macos-latest
    needs: android
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create iOS folder if still missing
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --org kg.toguz --project-name toguz_korgool . && rm -f test/widget_test.dart; fi
      - run: flutter pub get
      - name: Build for iPhone (no signing, just checks it compiles)
        run: |
          set +e
          flutter build ios --release --no-codesign > ios.txt 2>&1
          code=$?
          tail -n 60 ios.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -vE '^\s*$' ios.txt | tail -n 60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter build ios::${msg}"
          fi
          exit $code

  web-preview:
    runs-on: ubuntu-latest
    needs: android
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build a web copy (only for checking the screens)
        run: |
          flutter create --platforms=web --org kg.toguz --project-name toguz_korgool . >/dev/null
          rm -f test/widget_test.dart
          flutter pub get
          set +e
          flutter build web --release --no-web-resources-cdn > web.txt 2>&1 || flutter build web --release > web.txt 2>&1
          code=$?
          tail -n 30 web.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -vE '^\s*$' web.txt | tail -n 40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter build web::${msg}"
            exit $code
          fi
          cd build/web && zip -qr ../../web.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          files: app/web.zip
